name: build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build AAR (gomobile)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$(go env GOPATH)/bin:$PATH
          gomobile init
          cd core
          go get -tool golang.org/x/mobile/cmd/gobind
          go mod tidy
          go get golang.org/x/sys@v0.48.0
          go get -tool golang.org/x/mobile/cmd/gobind
          go mod tidy
          mkdir -p ../app/libs app/libs
          gomobile bind -androidapi 26 -target=android -o ../app/libs/zrokcore.aar .
          AAR=$(find .. -name "*.aar" | head -1)
          echo "=== AAR: $AAR ==="
          unzip -o "$AAR" classes.jar -d /tmp/aardump
          unzip -l /tmp/aardump/classes.jar | grep -E "\.class|\.java" | head -40
      - name: Build APK
        run: |
          echo sdk.dir=$ANDROID_HOME >> local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > keystore.p12
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "signing: $APK"
          "$BT/zipalign" -f 4 "$APK" /tmp/aligned.apk
          "$BT/apksigner" sign --ks-type PKCS12 --ks keystore.p12 --ks-key-alias "$KS_ALIAS" --ks-pass "pass:$KS_PASS" --out "$APK" /tmp/aligned.apk


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zrok-android-apk
          path: app/build/outputs/apk/release/app-release.apk
